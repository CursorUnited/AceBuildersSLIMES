<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="705" viewBox="0 0 1680 705" font-family="'Segoe UI', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="72.4" font-size="36" fill="#0F4C5C">Where her data lives</text>
<rect x="60" y="130" width="520" height="400" rx="14" fill="#fdebc8" stroke="#E9A23B" stroke-width="2" />
<text x="320" y="226.05" text-anchor="middle" font-size="22" fill="#1e1e1e">HER PHONE (localStorage)</text>
<text x="320" y="253.55" text-anchor="middle" font-size="22" fill="#1e1e1e"></text>
<text x="320" y="281.05" text-anchor="middle" font-size="22" fill="#1e1e1e">• her answers (profile)</text>
<text x="320" y="308.55" text-anchor="middle" font-size="22" fill="#1e1e1e">• chat history</text>
<text x="320" y="336.05" text-anchor="middle" font-size="22" fill="#1e1e1e">• tracked schemes, ticked documents</text>
<text x="320" y="363.55" text-anchor="middle" font-size="22" fill="#1e1e1e">• reminder dates</text>
<text x="320" y="391.05" text-anchor="middle" font-size="22" fill="#1e1e1e"></text>
<text x="320" y="418.55" text-anchor="middle" font-size="22" fill="#1e1e1e">"Forget me" wipes all of it</text>
<text x="320" y="446.05" text-anchor="middle" font-size="22" fill="#1e1e1e">No account. No login.</text>
<rect x="660" y="130" width="480" height="400" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
<text x="900" y="253.55" text-anchor="middle" font-size="22" fill="#1e1e1e">OUR SERVER</text>
<text x="900" y="281.05" text-anchor="middle" font-size="22" fill="#1e1e1e"></text>
<text x="900" y="308.55" text-anchor="middle" font-size="22" fill="#1e1e1e">• the public scheme rules only</text>
<text x="900" y="336.05" text-anchor="middle" font-size="22" fill="#1e1e1e">• passes her message to Gemini</text>
<text x="900" y="363.55" text-anchor="middle" font-size="22" fill="#1e1e1e">  to extract facts</text>
<text x="900" y="391.05" text-anchor="middle" font-size="22" fill="#1e1e1e">• never logs or stores the message</text>
<text x="900" y="418.55" text-anchor="middle" font-size="22" fill="#1e1e1e">• no student database</text>
<rect x="1220" y="130" width="400" height="400" rx="14" fill="#ffe3e3" stroke="#e03131" stroke-width="2" />
<text x="1420" y="253.55" text-anchor="middle" font-size="22" fill="#1e1e1e">NEVER COLLECTED</text>
<text x="1420" y="281.05" text-anchor="middle" font-size="22" fill="#1e1e1e"></text>
<text x="1420" y="308.55" text-anchor="middle" font-size="22" fill="#1e1e1e">✗ Aadhaar or any ID number</text>
<text x="1420" y="336.05" text-anchor="middle" font-size="22" fill="#1e1e1e">  (ignored if typed)</text>
<text x="1420" y="363.55" text-anchor="middle" font-size="22" fill="#1e1e1e">✗ phone number or email</text>
<text x="1420" y="391.05" text-anchor="middle" font-size="22" fill="#1e1e1e">✗ income proof, certificates</text>
<text x="1420" y="418.55" text-anchor="middle" font-size="22" fill="#1e1e1e">✗ passwords</text>
<path d="M580 330 L660 330" fill="none" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#a)" marker-start="url(#a)"/>
<text x="60" y="589.8" font-size="22" fill="#0F4C5C">Wording is always "likely eligible". The office makes the final decision, and every scheme links its official source.</text>
<text x="60" y="638" font-size="20" fill="#868e96">Honest limit: on the free Gemini tier, Google's terms can allow prompts to be used. A real launch would use a paid key.</text>
</svg>