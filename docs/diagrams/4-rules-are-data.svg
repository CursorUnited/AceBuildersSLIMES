<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="755" viewBox="0 0 1660 755" font-family="'Segoe UI', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="72.4" font-size="36" fill="#0F4C5C">New scheme in about a minute: no developer, no deploy</text>
