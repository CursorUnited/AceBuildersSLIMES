<text x="210" y="195.5" text-anchor="middle" font-size="20" fill="#1e1e1e">OFFICIAL PAGE</text>
<text x="210" y="220.5" text-anchor="middle" font-size="20" fill="#1e1e1e">copy the scheme text</text>
<text x="210" y="245.5" text-anchor="middle" font-size="20" fill="#1e1e1e">+ its https link</text>
