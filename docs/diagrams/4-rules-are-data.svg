<rect x="440" y="420" width="300" height="130" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2" />
<text x="590" y="477.3" text-anchor="middle" font-size="22" fill="#1e1e1e">SUPABASE</text>
<text x="590" y="504.8" text-anchor="middle" font-size="22" fill="#1e1e1e">schemes table</text>
<path d="M440 485 L360 485" fill="none" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#a)" />
<rect x="60" y="420" width="300" height="130" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
<text x="210" y="465.5" text-anchor="middle" font-size="20" fill="#1e1e1e">LIVE FOR STUDENTS</text>
<text x="210" y="490.5" text-anchor="middle" font-size="20" fill="#1e1e1e">and for MCP agents,</text>
<text x="210" y="515.5" text-anchor="middle" font-size="20" fill="#1e1e1e">right away</text>
<text x="60" y="659.8" font-size="22" fill="#0F4C5C">Adding Karnataka or Kerala is the same loop: paste their official page, review, publish.</text>
<text x="60" y="687.3" font-size="22" fill="#0F4C5C">Every scheme shows its source and a "last verified" date, and stale ones are flagged after 90 days.</text>
