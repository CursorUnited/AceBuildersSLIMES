<text x="1415" y="220.5" text-anchor="middle" font-size="20" fill="#1e1e1e">Kavya · Arun · Fathima</text>
<text x="1415" y="245.5" text-anchor="middle" font-size="20" fill="#1e1e1e">see ✓ ✗ ? for each rule</text>
<path d="M1415 280 L1415 420" fill="none" stroke="#0F4C5C" stroke-width="2"  marker-end="url(#a)" />
