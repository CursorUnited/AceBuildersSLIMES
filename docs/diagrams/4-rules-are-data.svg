<text x="1415" y="453" text-anchor="middle" font-size="20" fill="#1e1e1e">GUARDRAILS</text>
<text x="1415" y="478" text-anchor="middle" font-size="20" fill="#1e1e1e">lowercase id · no overwrite</text>
<text x="1415" y="503" text-anchor="middle" font-size="20" fill="#1e1e1e">real dates · 2-letter state</text>
<text x="1415" y="528" text-anchor="middle" font-size="20" fill="#1e1e1e">https sources only</text>
<path d="M1230 485 L1150 485" fill="none" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#a)" />
<rect x="820" y="420" width="330" height="130" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2" />
<text x="985" y="477.3" text-anchor="middle" font-size="22" fill="#1e1e1e">PUBLISH</text>
<text x="985" y="504.8" text-anchor="middle" font-size="22" fill="#1e1e1e">(or save as draft)</text>
