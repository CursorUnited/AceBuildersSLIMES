<text x="985" y="208" text-anchor="middle" font-size="20" fill="#1e1e1e">conditions · documents</text>
<text x="985" y="233" text-anchor="middle" font-size="20" fill="#1e1e1e">Tamil text · deadline</text>
<text x="985" y="258" text-anchor="middle" font-size="20" fill="#1e1e1e">warnings</text>
