<text x="590" y="245.5" text-anchor="middle" font-size="20" fill="#1e1e1e">in about 8 seconds</text>
<path d="M740 215 L820 215" fill="none" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#a)" />
