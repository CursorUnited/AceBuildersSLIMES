<rect x="440" y="150" width="300" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2" />
<text x="590" y="195.5" text-anchor="middle" font-size="20" fill="#1e1e1e">ADMIN: AI IMPORT</text>
